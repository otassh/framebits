name: changelog

# Build the static changelog site from CHANGELOG.md (stdlib-only Node script,
# no install step needed) and publish it to GitHub Pages
# (https://otassh.github.io/framebits/). The Pages site itself was created
# once via the API with `build_type: workflow`, so this workflow owns deploys.

on:
  push:
    branches: [main]
    paths:
      - "CHANGELOG.md"
      - "scripts/changelog/**"
      - ".github/workflows/changelog.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Build the changelog site
        run: |
          node scripts/changelog/build.mjs --out dist/changelog-site
          test -s dist/changelog-site/index.html
          grep -F "Framebits Changelog" dist/changelog-site/index.html
      - uses: actions/upload-pages-artifact@7b1ee2f8d29c9797d58b786ea7907718390d3f68 # v3
        with:
          path: dist/changelog-site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db5a2899c0b5ff63a9a558a6140831713e18f8 # v4
