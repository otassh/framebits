name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:registry --check
      - run: pnpm build

  cli-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter framebits build
      - name: packed bundle has no workspace runtime imports
        run: |
          if grep -F "@framebits/" apps/cli/dist/cli.js; then
            echo "::error::apps/cli/dist/cli.js references @framebits/* at runtime; the bundle must be self-contained (only cross-spawn stays external)"
            exit 1
          fi
          echo "dist/cli.js is self-contained (no @framebits/* references)"
      - run: pnpm --filter framebits exec tsup --version
      - run: node apps/cli/scripts/pack-smoke.mjs
      - run: pnpm --filter framebits test
