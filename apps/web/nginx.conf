# apps/web nginx.conf (Task 6). Included as conf.d/default.conf in the
# nginx-unprivileged image. Serves the Vite dist/ on :3000 with SPA fallback;
# the registry itself is served by Caddy, never by this host.
server {
  listen 3000;
  listen [::]:3000;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Security headers (Caddy adds the outer layer too; defense in depth).
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  # Hashed Vite assets: immutable for a year.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA fallback: /components/<slug> and every other route serve index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
