# deploy/docker-compose.local.yml — standalone local verification stack (Task 6).
# WARNING: local-only. Never use this file in production: plain HTTP :8080,
# no TLS, Postgres IS published, and credentials below are throwaway dev-only
# defaults.
# Mirrors production semantics (cache/CORS/security headers, healthchecks,
# limits, internal backend network) on plain HTTP :8080 so the Task 6
# acceptance check runs with one command from the repo root:
#
#   pnpm build:registry --out dist/registry
#   docker compose -f deploy/docker-compose.local.yml up --build
#   bash scripts/verify-registry-headers.sh http://localhost:8080
#
# Postgres IS published here (dev/test access); production never publishes it.
# Throwaway dev credentials have safe local defaults; set POSTGRES_PASSWORD
# in the environment to override.
name: framebits-local

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true

volumes:
  pgdata-local:
  caddy_data_local:
  caddy_config_local:

services:
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./Caddyfile.local:/etc/caddy/Caddyfile:ro
      - ../dist/registry:/srv/registry:ro
      - caddy_data_local:/data
      - caddy_config_local:/config
    depends_on:
      - api
      - web
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    mem_limit: 256m
    cpus: 0.5

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: framebits-api:local
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      PORT: "3001"
      DATABASE_URL: postgres://${POSTGRES_USER:-framebits}:${POSTGRES_PASSWORD:-framebits-local-dev-only}@postgres:5432/${POSTGRES_DB:-framebits}
      TRUSTED_PROXY_COUNT: "1"
    expose:
      - "3001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3001/api/health').then((r)=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    mem_limit: 512m
    cpus: 1.0

  postgres:
    image: postgres:16.9-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-framebits}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-framebits-local-dev-only}
      POSTGRES_DB: ${POSTGRES_DB:-framebits}
    ports:
      - "5432:5432"
    volumes:
      - pgdata-local:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-framebits} -d $${POSTGRES_DB:-framebits}"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
    mem_limit: 512m
    cpus: 1.0

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    image: framebits-web:local
    restart: unless-stopped
    networks:
      - frontend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    mem_limit: 256m
    cpus: 0.5
