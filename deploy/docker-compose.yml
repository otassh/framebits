# deploy/docker-compose.yml — production stack for the single VPS (Task 6).
# Services: caddy (TLS + static registry), api (Hono, Task 8), postgres 16
# (internal only), web (static SPA). Postgres is never published to the host.
# All images are pinned; all services have healthchecks, resource limits and
# `restart: unless-stopped`; Postgres + Caddy data live in named volumes while
# the registry is the host path /var/www (read-only) managed by deploy.sh.
#
# Required env (see deploy/README.md, never commit): POSTGRES_PASSWORD.
# Optional: POSTGRES_USER/POSTGRES_DB (default framebits), DOMAIN
# (default framebits.dev), GIT_SHA (image tags, default local).
name: framebits

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true

volumes:
  pgdata:
  caddy_data:
  caddy_config:

services:
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    # Non-root: relies on Docker's default NET_BIND_SERVICE capability to bind
    # 80/443. Named volumes below must be writable by this uid on first deploy
    # (see deploy/README.md step 7).
    user: "65532:65532"
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-framebits.dev}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /var/www:/var/www:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web
    networks:
      - frontend
      - backend
    healthcheck:
      # Caddy only serves {$DOMAIN}; plain localhost Host would 404/mismatch,
      # so send the configured Host explicitly. $$ escapes Compose interpolation.
      test: ["CMD-SHELL", "wget --header \"Host: $${DOMAIN:-framebits.dev}\" -qO- http://127.0.0.1:80/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    # Compose-native limits (deploy.resources.limits only applies in Swarm and
    # is ignored by `docker compose up`). Reservations would need Swarm; the
    # values below are limits only — see deploy/README.md.
    mem_limit: 256m
    cpus: 0.5

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: framebits-api:${GIT_SHA:-local}
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      PORT: "3001"
      DATABASE_URL: postgres://${POSTGRES_USER:-framebits}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the environment or .env}:5432/${POSTGRES_DB:-framebits}
      TRUSTED_PROXY_COUNT: "1"
    expose:
      - "3001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3001/api/health').then((r)=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    # Compose-native limits (see caddy comment above re Swarm reservations).
    mem_limit: 512m
    cpus: 1.0

  postgres:
    image: postgres:16.9-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-framebits}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the environment or .env}
      POSTGRES_DB: ${POSTGRES_DB:-framebits}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-framebits} -d $${POSTGRES_DB:-framebits}"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
    # Compose-native limits (see caddy comment above re Swarm reservations).
    mem_limit: 512m
    cpus: 1.0

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    image: framebits-web:${GIT_SHA:-local}
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      - frontend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    # Compose-native limits (see caddy comment above re Swarm reservations).
    mem_limit: 256m
    cpus: 0.5
